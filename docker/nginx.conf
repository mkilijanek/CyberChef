server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Baseline hardening headers (see issue #126).
    # script-src is deliberately not restricted: operation HTML output relies on
    # eval() of inline <script> blocks (OutputWaiter) and on blob: workers/WASM.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
